name: agrovision

services:
  mysql:
    image: mysql:8.0.46
    environment:
      MYSQL_DATABASE: AgroVision
      MYSQL_USER: agrovision
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-agrovision_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-agrovision_root_local}
      TZ: America/Sao_Paulo
    volumes:
      - mysql_data:/var/lib/mysql
      - type: bind
        source: ./docker/mysql/seed/AgroVision.sql
        target: /docker-entrypoint-initdb.d/10-agrovision.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u "$${MYSQL_USER}" --database=AgroVision --silent --execute="SELECT 1"']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
      TZ: America/Sao_Paulo
    volumes:
      - mailpit_data:/data

  backend:
    build: ./Back-end
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/AgroVision?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
      SPRING_DATASOURCE_USERNAME: agrovision
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-agrovision_local}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_SMTP_AUTH: "false"
      MAIL_STARTTLS: "false"
      APP_FRONTEND_URL: http://localhost:${APP_PORT:-4200}
      JWT_SECRET: ${JWT_SECRET:-YWdyb3Zpc2lvbi1zb21lbnRlLWRlbW9uc3RyYWNhby1sb2NhbC0zMi1ieXRlcw==}
      TZ: America/Sao_Paulo
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: [CMD-SHELL, 'code=$$(curl --silent --max-time 5 --output /dev/null --write-out "%{http_code}" http://localhost:8080/api/me/context); [ "$$code" = 401 ] || [ "$$code" = 403 ]']
      interval: 10s
      timeout: 6s
      retries: 20
      start_period: 60s

  frontend:
    build:
      context: ./Front-end/agrovision-web
      args:
        MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
        MAPTILER_API_KEY: ${MAPTILER_API_KEY:-}
    ports:
      - "127.0.0.1:${APP_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/']
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  mailpit_data:
