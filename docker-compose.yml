# Execute na raiz: docker compose up --build -d --wait
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootroot}
      MYSQL_DATABASE: ${DB_NAME:-AgroVision}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      # TCP so fica disponivel depois que a importacao inicial terminou.
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -uroot --database="$${MYSQL_DATABASE}" --silent --execute="SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  mailpit:
    image: axllent/mailpit:v1.27.10
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./Back-end
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-AgroVision}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-rootroot}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:-YWdyb3Zpc2lvbi1zb21lbnRlLWRlbW9uc3RyYWNhby1sb2NhbC0zMi1ieXRlcw==}
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_SMTP_AUTH: "false"
      MAIL_STARTTLS: "false"
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:4200}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      TZ: America/Sao_Paulo
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "5", http://localhost:8080/actuator/health]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 60s

  frontend:
    build:
      context: ./Front-end/agrovision-web
    restart: unless-stopped
    environment:
      MAPTILER_API_KEY: ${MAPTILER_API_KEY:-}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-4200}:80"
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  mailpit_data:
