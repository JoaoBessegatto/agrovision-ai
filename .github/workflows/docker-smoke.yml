name: Docker Compose

on:
  push:
    branches: [feat/docker-compose]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: agrovision-ci
      MAPBOX_ACCESS_TOKEN: pk.smoke-test
      MAPTILER_API_KEY: smoke-test
    steps:
      - uses: actions/checkout@v4
      - name: Construir e iniciar os quatro servicos
        run: docker compose --env-file .env.example up --build -d --wait --wait-timeout 300
      - name: Conferir importacao do backup
        run: |
          for table in usuario fazenda rebanho animal registro_peso; do
            count=$(docker compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot --database="$MYSQL_DATABASE" --batch --skip-column-names -e "SELECT COUNT(*) FROM $1"' sh "$table")
            test "$count" -gt 0
          done
      - name: Verificar interface, API, banco e e-mail
        run: python3 scripts/smoke-docker.py --write-test-data
      - name: Verificar persistencia apos recriar containers
        run: |
          before=$(docker compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot --database="$MYSQL_DATABASE" --batch --skip-column-names -e "SELECT COUNT(*) FROM usuario"')
          docker compose --env-file .env.example down
          docker compose --env-file .env.example up -d --wait --wait-timeout 300
          after=$(docker compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot --database="$MYSQL_DATABASE" --batch --skip-column-names -e "SELECT COUNT(*) FROM usuario"')
          test "$before" = "$after"
          python3 scripts/smoke-docker.py
      - name: Diagnostico de falhas
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100 mysql backend frontend mailpit
      - name: Limpar somente a instancia efemera do CI
        if: always()
        run: docker compose --env-file .env.example down -v
